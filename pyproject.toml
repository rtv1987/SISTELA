[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sistela-assistant"
dynamic = ["version"]
description = "Local estimate preparation assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.54.0", "sqlalchemy==2.1.1",
  "alembic==1.20.0", "pdfplumber==0.11.10", "openpyxl==3.1.5",
  "dbfread==2.0.7", "python-multipart==0.0.32", "rapidfuzz==3.14.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.9"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.dynamic]
version = {attr = "sistela.version.VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
markers = ["fixtures: tests requiring confidential local source files"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["sistela"]
